<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه پرامپت‌های حقوقی | باشگاه وکلای افرا</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* استایل‌های اختصاصی کتابخانه پرامپت */
        .prompt-library-header {
            background: linear-gradient(135deg, var(--primary, #1976d2), #42a5f5);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .prompt-library-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .prompt-library-header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .search-container input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid var(--border, #e0e0e0);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--card-bg, #ffffff);
            color: var(--text, #333);
            transition: all 0.3s;
        }
        
        .search-container input:focus {
            outline: none;
            border-color: var(--primary, #1976d2);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }
        
        .search-container i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light, #666);
        }
        
        .info-banner {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border, #e0e0e0);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-light, #666);
        }
        
        .info-item i {
            color: var(--primary, #1976d2);
            font-size: 1.2rem;
        }
        
        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .prompt-card {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border, #e0e0e0);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        
        .prompt-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: var(--primary, #1976d2);
        }
        
        .prompt-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .prompt-card h3 {
            font-size: 1.1rem;
            color: var(--text, #333);
            margin: 0;
            flex: 1;
        }
        
        .prompt-badge {
            background: var(--primary-light, #e3f2fd);
            color: var(--primary, #1976d2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .prompt-excerpt {
            color: var(--text-light, #666);
            font-size: 0.9rem;
            line-height: 1.7;
            margin: 15px 0;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .prompt-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border, #e0e0e0);
        }
        
        .btn-view {
            background: var(--primary, #1976d2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .btn-view:hover {
            background: #1565c0;
            transform: scale(1.05);
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: var(--card-bg, #ffffff);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border, #e0e0e0);
        }
        
        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--text, #333);
            margin: 0 0 10px 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light, #666);
            line-height: 1;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--border, #e0e0e0);
            color: var(--text, #333);
        }
        
        .modal-body {
            color: var(--text, #333);
            font-size: 0.95rem;
            line-height: 2;
            white-space: pre-wrap;
            margin-bottom: 25px;
        }
        
        .btn-copy-full {
            background: var(--primary, #1976d2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all 0.2s;
        }
        
        .btn-copy-full:hover {
            background: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3);
        }
        
        .btn-copy-full.copied {
            background: var(--success, #2e7d32);
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light, #666);
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .prompts-grid {
                grid-template-columns: 1fr;
            }
            
            .info-banner {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

            </div>
            <div class="info-item">

            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="جستجو در عنوان و متن پرامپت‌ها...">
        </div>

        <div class="prompts-grid" id="promptsGrid"></div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <div>

// توابع
function renderPrompts(filter = '') {
    const grid = document.getElementById('promptsGrid');
    const filtered = promptsData.filter(p => 
        p.title.includes(filter) || 
        p.content.includes(filter) || 
        p.category.includes(filter)
    );
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px;"></i><p>پرامپتی با این مشخصات یافت نشد</p></div>';
        return;
    }
    
    grid.innerHTML = filtered.map(p => `
        <div class="prompt-card" onclick="openModal(${p.id})">
            <div class="prompt-card-header">
                <h3>${p.title}</h3>
                <span class="prompt-badge">${p.category}</span>
            </div>
            <p class="prompt-excerpt">${p.content.substring(0, 150).replace(/\n/g, ' ')}...</p>
            <div class="prompt-card-footer">
                <button class="btn-view">مشاهده کامل</button>
            </div>
        </div>
    `).join('');
}

function openModal(id) {
    const prompt = promptsData.find(p => p.id === id);
    if (!prompt) return;
    
    document.getElementById('modalTitle').textContent = prompt.title;
    document.getElementById('modalBadge').textContent = prompt.category;
    document.getElementById('modalBody').textContent = prompt.content;
    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    
    // تنظیم دکمه کپی
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.onclick = () => {
        navigator.clipboard.writeText(prompt.content).then(() => {
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '<i class="fas fa-check"></i><span>کپی شد!</span>';
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.innerHTML = '<i class="fas fa-copy"></i><span>کپی متن پرامپت</span>';
            }, 2000);
        });
    };
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

// رویدادها
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
};
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    renderPrompts(e.target.value.trim());
});

// اجرای اولیه
renderPrompts();
</script>
