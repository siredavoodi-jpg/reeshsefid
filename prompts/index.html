            "content": "نقش: تو یک مدیر پرونده با تخصص در برنامه‌ریزی حقوقی هستی.\n\nپرونده را به برنامه عملیاتی تبدیل کن:\n\n**چک‌لیست مدارک:**\n- [ ] مورد ۱\n- [ ] مورد ۲\n\n**اقدامات فوری (۲۴ ساعت):**\n- [لیست با اولویت]\n\n**اقدامات بعدی (هفته جاری):**\n- [لیست]\n\n**مهلت‌های قانونی:**\n| مهلت | تاریخ | نوع |\n|------|-------|-----|\n| ... | ... | ... |\n\n**هشدارهای زمانی:**\n- [هشدار ۱]\n- [هشدار ۲]\n\n**اولویت‌بندی کارها:**\n| کار | اولویت (۱-۵) | مسئول |\n|-----|-------------|--------|\n\n**برنامه هفتگی پیگیری:**\n- شنبه: [کارها]\n- یکشنبه: [کارها]\n- ...\n\n**ریسک‌های عدم اقدام:**\n- [ریسک ۱ + پیامد]\n- [ریسک ۲ + پیامد]\n\n**Dashboard وضعیت پرونده:**\n| اقدام | مسئول | مهلت | اولویت | وضعیت |\n|-------|--------|------|--------|--------|\n| ... | ... | ... | ... | ... |\n\n**نکته کاربردی برای وکیل:**\n- این پرامپت برای وکلایی که همزمان چندین پرونده دارند، مانند یک دستیار حقوقی عمل می‌کند.\n- پس از دریافت برنامه، حتماً مهلت‌های قانونی (مثل مواعد تجدیدنظر یا واخواهی) را در تقویم شخصی خود ثبت کنید."
