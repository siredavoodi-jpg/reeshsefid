<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه پرامپت‌ها | باشگاه افرا</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../assets/logo.jpg" alt="لوگو" class="sidebar-logo">
            <h2>باشگاه وکلای افرا</h2>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item">
                <a href="../index.html" class="nav-link"><span><i class="fas fa-home"></i> صفحه اصلی</span></a>
            </li>
            <!-- کلاس open برای باز نگه داشتن منو در این صفحه اضافه شده است -->
            <li class="nav-item open" id="courses-dropdown">
                <a class="nav-link toggle-dropdown active"><span><i class="fas fa-graduation-cap"></i> دوره‌ها</span> <i class="fas fa-chevron-down arrow"></i></a>
                <ul class="dropdown-menu">
                    <li><a href="../courses/index.html">دوره‌های آموزشی</a></li>
                    <li><a href="index.html" class="active">کتابخانه پرامپت‌ها</a></li>
                </ul>
            </li>
            <li class="nav-item">
                <a href="../services/index.html" class="nav-link"><span><i class="fas fa-briefcase"></i> خدمات</span></a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="theme-toggle" class="btn-theme"><i class="fas fa-moon"></i> حالت تاریک</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div><h1>📚 کتابخانه پرامپت‌های حقوقی</h1><p class="page-subtitle">مجموعه‌ای از پرامپت‌های مهندسی‌شده برای وکلا</p></div>
        </header>

        <div class="search-wrap">
            <i class="fas fa-search" style="position:absolute; right:15px; top:14px; color:var(--text-light);"></i>
            <input type="text" id="searchInput" placeholder="جستجو در عنوان و متن پرامپت‌ها...">
        </div>

        <div class="grid-container" id="promptsGrid">
            <!-- پرامپت‌ها توسط جاوااسکریپت در اینجا بارگذاری می‌شوند -->
        </div>
    </main>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
    <div class="dossier">
        <div class="dossier-header">
            <h2 id="modalTitle" style="margin:0;"></h2>
            <button class="dossier-close" id="closeModal">&times;</button>
        </div>
        <div class="dossier-content" id="modalContent"></div>
        <button class="btn-copy" id="copyBtn" style="margin-top:20px; width:100%; justify-content:center;"><i class="fas fa-copy"></i> کپی متن پرامپت</button>
    </div>
</div>

<script src="../assets/script.js"></script>
<script>
    // داده‌های پرامپت (فقط ۳ نمونه برای اختصار، شما می‌توانید همه ۱۱ مورد را از فایل قبلی اینجا کپی کنید)
    const promptsData = [
        {"id":1,"title":"تحلیل جامع پرونده","category":"تحلیل پرونده","content":"نقش: تو یک وکیل پایه‌یک دادگستری...\n(متن کامل پرامپت ۱ را اینجا قرار دهید)"},
        {"id":2,"title":"زنجیره پرسش‌های هوشمند","category":"تحلیل پرونده","content":"نقش: تو یک دستیار جمع‌آوری اطلاعات...\n(متن کامل پرامپت ۲ را اینجا قرار دهید)"},
        {"id":11,"title":"مرور ادبیات دانشگاهی حقوقی","category":"پژوهش حقوقی","content":"نقش: تو یک پژوهشگر دانشگاهی...\n(متن کامل پرامپت ۱۱ را اینجا قرار دهید)"}
    ];

    const grid = document.getElementById('promptsGrid');
    const overlay = document.getElementById('overlay');
    
    function renderPrompts(filter = '') {
        grid.innerHTML = '';
        promptsData.filter(p => p.title.includes(filter) || p.content.includes(filter)).forEach(p => {
            const card = document.createElement('div');
            card.className = 'card prompt-card';
            card.innerHTML = `
                <div class="prompt-header"><h3>${p.title}</h3><span class="badge">${p.category}</span></div>
                <p class="prompt-excerpt">${p.content.substring(0, 150)}...</p>
                <button class="btn-copy" onclick="event.stopPropagation(); openModal(${p.id})">مشاهده و کپی</button>
            `;
            card.onclick = () => openModal(p.id);
            grid.appendChild(card);
        });
    }

    function openModal(id) {
        const p = promptsData.find(x => x.id === id);
        document.getElementById('modalTitle').innerText = p.title;
        document.getElementById('modalContent').innerText = p.content;
        overlay.classList.add('open');
        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(p.content);
            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i class="fas fa-check"></i> کپی شد!';
            btn.classList.add('success');
            setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> کپی متن پرامپت'; btn.classList.remove('success'); }, 2000);
        };
    }

    document.getElementById('closeModal').onclick = () => overlay.classList.remove('open');
    overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove('open'); };
    document.getElementById('searchInput').addEventListener('input', (e) => renderPrompts(e.target.value));
    
    renderPrompts();
</script>
</body>
</html>
