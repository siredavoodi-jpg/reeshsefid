<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوش مصنوعی برای وکلا | باشگاه وکلای افرا</title>
    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* استایل‌های اختصاصی صفحه دوره */
        .chapter-list-sidebar {
            list-style: none;
            padding-right: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .nav-item.open > .chapter-list-sidebar {
            max-height: 800px;
        }
        .chapter-list-sidebar li a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: var(--text-light);
            border-radius: 6px;
            border-right: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        .chapter-list-sidebar li a:hover,
        .chapter-list-sidebar li a.active {
            color: var(--primary);
            border-right-color: var(--primary);
            background: color-mix(in srgb, var(--primary) 8%, transparent);
        }
        .chapter-list-sidebar .ch-num {
            background: var(--primary-light);
            color: var(--primary);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .chapter-list-sidebar li a.active .ch-num {
            background: var(--primary);
            color: white;
        }

        /* کارت‌های درس */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-top: 1.5rem;
        }
        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
        }
        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px; height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.25s;
        }
        .lesson-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .lesson-card:hover::before { opacity: 1; }
        .lesson-card.viewed { border-color: #86efac; }
        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 0.9rem;
        }
        .card-icon {
            background: var(--primary-light);
            color: var(--primary);
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text);
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: auto;
            flex-wrap: wrap;
        }
        .badge {
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .badge.مقدماتی { background: #dcfce7; color: #166534; }
        .badge.متوسط { background: #fef9c3; color: #854d0e; }
        .badge.پیشرفته { background: #fee2e2; color: #991b1b; }
        body.dark-mode .badge.مقدماتی { background: #14532d; color: #86efac; }
        body.dark-mode .badge.متوسط { background: #713f12; color: #fde68a; }
        body.dark-mode .badge.پیشرفته { background: #7f1d1d; color: #fca5a5; }

        /* کارت غیرفعال */
        .inactive-card {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-light);
            margin-top: 1.5rem;
        }
        .inactive-card i {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
            display: block;
        }
        body.dark-mode .inactive-card i { color: #475569; }

        /* جزئیات درس */
        .lesson-detail {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
        }
        .back-to-list-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .back-to-list-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .objectives-list, .summary-box {
            background: var(--bg);
            padding: 1.1rem 1.4rem;
            border-radius: 8px;
            border-right: 4px solid #f59e0b;
            margin: 1rem 0;
        }
        .summary-box { border-right-color: var(--primary); }
        .objectives-list ul, .summary-box ul {
            padding-right: 1.2rem;
            margin: 0.4rem 0 0 0;
        }
        .objectives-list li, .summary-box li { margin-bottom: 0.35rem; }

        .quiz-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 12px;
        }
        body.dark-mode .quiz-container {
            background: #422006;
            border-color: #a16207;
        }

        .chapter-header h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }
        .chapter-header p { color: var(--text-light); font-size: 0.95rem; }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- منوی سمت راست (هم‌سبک با کل سایت) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../../assets/logo.jpg" alt="لوگو" class="sidebar-logo" onerror="this.src='../../assets/logo.png'">
            <h2>باشگاه وکلای افرا</h2>
        </div>

        <ul class="sidebar-nav">
            <!-- صفحه اصلی -->
            <li class="nav-item">
                <a href="../../index.html" class="nav-link">
                    <span><i class="fas fa-home"></i> صفحه اصلی</span>
                </a>
            </li>

            <!-- دوره‌ها -->
            <li class="nav-item open" id="courses-dropdown">
                <a class="nav-link toggle-dropdown active">
                    <span><i class="fas fa-graduation-cap"></i> دوره‌ها</span>
                    <i class="fas fa-chevron-down arrow"></i>
                </a>
                <ul class="dropdown-menu">
                    <!-- دوره‌های آموزشی -->
                    <li class="nav-item open" id="courses-sub-dropdown">
                        <a class="toggle-sub-dropdown active">
                            <span>دوره‌های آموزشی</span>
                            <i class="fas fa-chevron-down arrow"></i>
                        </a>
                        <ul class="sub-dropdown">
                            <!-- عنوان دوره اصلی -->
                            <li class="nav-item open" id="course-title-item">
                                <a class="toggle-course-chapters active" id="course-main-link">
                                    <span><i class="fas fa-robot"></i> هوش مصنوعی برای وکلا</span>
                                    <i class="fas fa-chevron-down arrow"></i>
                                </a>
                                <!-- ۱۲ فصل به‌عنوان زیرمجموعه -->
                                <ul class="chapter-list-sidebar" id="chapter-list">
                                    <!-- توسط جاوااسکریپت پر می‌شود -->
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <a href="../../prompts/index.html">کتابخانه پرامپت‌ها</a>
                    </li>
                </ul>
            </li>

            <!-- خدمات -->
            <li class="nav-item">
                <a href="../../services/index.html" class="nav-link">
                    <span><i class="fas fa-briefcase"></i> خدمات</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <button id="theme-toggle" class="btn-theme">
                <i class="fas fa-moon"></i> حالت تاریک
            </button>
        </div>
    </aside>

    <!-- محتوای اصلی سمت چپ -->
    <main class="main-content" id="content-area">
        <!-- محتوا توسط app.js پر می‌شود -->
    </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// مدیریت منوهای چندسطحی (هماهنگ با کل سایت)
document.querySelectorAll('.toggle-dropdown').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
        e.preventDefault();
        toggle.parentElement.classList.toggle('open');
    });
});
document.querySelectorAll('.toggle-sub-dropdown').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
        e.preventDefault();
        toggle.parentElement.classList.toggle('open');
    });
});
document.querySelectorAll('.toggle-course-chapters').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
        e.preventDefault();
        toggle.parentElement.classList.toggle('open');
    });
});

// دارک‌مود
const themeToggle = document.getElementById('theme-toggle');
const savedTheme = localStorage.getItem('theme') || 'light';
if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    updateThemeIcon(true);
}
themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon(isDark);
});
function updateThemeIcon(isDark) {
    if (isDark) {
        themeToggle.innerHTML = '<i class="fas fa-sun"></i> حالت روشن';
    } else {
        themeToggle.innerHTML = '<i class="fas fa-moon"></i> حالت تاریک';
    }
}
</script>
</body>
</html>
