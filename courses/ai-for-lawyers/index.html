<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوش مصنوعی برای وکلا | باشگاه وکلای افرا</title>
<link rel="stylesheet" href="../../assets/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== متغیرهای رنگی ===== */
:root {
    --navy-deep: #0e1826;
    --navy-mid: #152740;
    --navy-line: #243a56;
    --parchment: #f4eee0;
    --parchment-dark: #e9e0c8;
    --parchment-line: #d9cca3;
    --ink: #1c2a3a;
    --ink-soft: #4a4534;
    --brass: #a9822f;
    --brass-light: #cda753;
    --brass-dim: #8a6d33;
    --seal: #7c3626;
    --ok: #2f6b4f;
    --serif: 'Noto Naskh Arabic', serif;
    --sans: 'Vazirmatn', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--navy-deep); color: var(--ink); }

/* ===== Layout ===== */
.app {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
}

/* ===== Sidebar (راست) ===== */
.sidebar {
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
    color: #e7ddc2;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    border-left: 1px solid var(--navy-line);
}

.sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(169,130,47,.25);
    text-align: center;
}

.sidebar-header h2 {
    font-family: var(--serif);
    font-size: 18px;
    color: #f2ead4;
}

.chapter-list {
    list-style: none;
    padding: 10px;
    flex: 1;
}

.chapter-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
}

.chapter-item:hover {
    background: rgba(255,255,255,.06);
}

.chapter-item.active {
    background: rgba(169,130,47,.18);
    border-right: 3px solid var(--brass-light);
    color: #f2ead4;
}

.chapter-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
}

.chapter-item.active .chapter-num {
    background: var(--brass);
    color: #fff;
}

/* ===== Main Content (چپ) ===== */
.main-content {
    background: var(--parchment);
    padding: 30px;
    overflow-y: auto;
    min-height: 100vh;
}

/* ===== Welcome Screen ===== */
.welcome-screen {
    max-width: 700px;
    margin: 60px auto;
    text-align: center;
}

.welcome-screen h1 {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--navy-deep);
    margin-bottom: 16px;
}

.welcome-screen p {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 2;
    margin-bottom: 24px;
}

.btn-start {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: var(--brass);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
}

.btn-start:hover { background: var(--brass-dim); }

/* ===== Chapter View (نمایش فصل) ===== */
.chapter-view {
    max-width: 900px;
    margin: 0 auto;
}

.chapter-title {
    font-family: var(--serif);
    font-size: 24px;
    color: var(--navy-deep);
    margin-bottom: 8px;
}

.chapter-desc {
    color: var(--ink-soft);
    margin-bottom: 30px;
    font-size: 14px;
}

/* ===== Lesson Cards ===== */
.lesson-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
}

.lesson-card {
    background: #fff;
    border: 1px solid var(--parchment-line);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.lesson-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
    border-color: var(--brass);
}

.lesson-card.viewed {
    border-color: var(--ok);
    background: #f0f8f0;
}

.lesson-card-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--parchment-dark);
    color: var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
}

.lesson-card.viewed .lesson-card-num {
    background: var(--ok);
    color: #fff;
}

.lesson-card-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--navy-deep);
    line-height: 1.6;
}

.lesson-card-meta {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 10px;
}

/* ===== Quiz Card ===== */
.quiz-card {
    background: #fff;
    border: 2px dashed var(--parchment-line);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    transition: all 0.3s;
}

.quiz-card.locked {
    opacity: 0.5;
    cursor: not-allowed;
}

.quiz-card.unlocked {
    border-color: var(--brass);
    border-style: solid;
    cursor: pointer;
}

.quiz-card.unlocked:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(169,130,47,.15);
}

.quiz-card h3 {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--navy-deep);
    margin-bottom: 8px;
}

.quiz-card p {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 12px;
}

.quiz-progress {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
}

.quiz-progress-bar {
    width: 120px;
    height: 6px;
    background: var(--parchment-dark);
    border-radius: 3px;
    overflow: hidden;
}

.quiz-progress-fill {
    height: 100%;
    background: var(--brass);
    border-radius: 3px;
    transition: width 0.3s;
}

/* ===== Lesson Content View ===== */
.lesson-content-view {
    max-width: 800px;
    margin: 0 auto;
}

.lesson-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
}

.lesson-breadcrumb a {
    color: var(--brass);
    cursor: pointer;
    text-decoration: none;
}

.lesson-breadcrumb a:hover { text-decoration: underline; }

.lesson-content-header {
    margin-bottom: 24px;
}

.lesson-content-header h1 {
    font-family: var(--serif);
    font-size: 26px;
    color: var(--navy-deep);
    margin-bottom: 12px;
}

.lesson-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.meta-pill {
    font-size: 12px;
    color: var(--ink-soft);
    border: 1px solid var(--parchment-line);
    background: rgba(255,255,255,.5);
    padding: 4px 12px;
    border-radius: 999px;
}

.bm-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--brass-dim);
    border: 1px solid var(--parchment-line);
    background: rgba(255,255,255,.5);
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--sans);
}

.bm-btn.on {
    color: var(--brass);
    border-color: var(--brass);
    background: rgba(169,130,47,.1);
}

/* ===== Lesson Sections ===== */
.lesson-section {
    margin-bottom: 24px;
}

.lesson-section h2 {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 700;
    color: var(--navy-deep);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--parchment-line);
}

.lesson-section p {
    font-size: 15px;
    line-height: 2;
    color: var(--ink);
    margin-bottom: 12px;
}

/* ===== Objectives ===== */
.objectives {
    background: var(--parchment-dark);
    border: 1px solid var(--parchment-line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    border-right: 3px solid var(--brass);
}

.objectives h3 {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--navy-deep);
    margin-bottom: 10px;
}

.objectives ul { list-style: none; }

.objectives li {
    font-size: 14px;
    line-height: 1.9;
    color: var(--ink-soft);
    padding-right: 20px;
    position: relative;
    margin-bottom: 6px;
}

.objectives li::before {
    content: "◆";
    position: absolute;
    right: 0;
    top: 2px;
    color: var(--brass);
    font-size: 9px;
}

/* ===== Info Cards ===== */
.card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin: 20px 0;
}

.info-card {
    background: rgba(255,255,255,.5);
    border: 1px solid var(--parchment-line);
    border-radius: 8px;
    padding: 18px 20px;
}

.info-card h4 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-deep);
    margin-bottom: 10px;
}

.info-card ul { list-style: none; }

.info-card li {
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink-soft);
    padding-right: 16px;
    position: relative;
    margin-bottom: 6px;
}

.info-card li::before {
    content: "—";
    position: absolute;
    right: 0;
    color: var(--brass-dim);
}

.card-examples { border-right: 3px solid var(--brass); }
.card-tips { border-right: 3px solid var(--ok); }
.card-mistakes { border-right: 3px solid var(--seal); }

/* ===== Glossary ===== */
.glossary-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
}

.gloss-item {
    background: rgba(255,255,255,.5);
    border: 1px solid var(--parchment-line);
    border-radius: 8px;
    padding: 14px 18px;
}

.gloss-term {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 14px;
    margin-bottom: 4px;
}

.gloss-def {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.8;
}

/* ===== Exercise ===== */
.exercise-box {
    background: var(--navy-deep);
    color: #e9e0c8;
    border-radius: 8px;
    padding: 22px 24px;
    margin: 24px 0;
}

.exercise-box h4 {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--brass-light);
    margin-bottom: 10px;
}

.exercise-box p {
    font-size: 14px;
    line-height: 1.95;
    color: #d7cead;
    margin-bottom: 14px;
}

.reveal-btn {
    font-size: 13px;
    color: var(--navy-deep);
    background: var(--brass-light);
    padding: 8px 16px;
    border-radius: 3px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
}

.reveal-btn:hover { background: #e0c584; }

.answer-box {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed rgba(233,224,200,.25);
    font-size: 14px;
    line-height: 1.9;
    color: #c9c0a2;
    display: none;
}

.answer-box.show { display: block; }

.answer-box .lbl {
    color: var(--brass-light);
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 6px;
    display: block;
}

/* ===== Summary ===== */
.summary-box {
    border: 1.5px solid var(--brass);
    border-radius: 8px;
    padding: 20px 22px;
    margin: 24px 0 10px;
    background: repeating-linear-gradient(135deg, rgba(169,130,47,.04) 0 12px, transparent 12px 24px);
}

.summary-box h4 {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--brass-dim);
    margin-bottom: 10px;
}

.summary-box ul { list-style: none; }

.summary-box li {
    font-size: 14px;
    line-height: 1.9;
    color: var(--ink);
    padding-right: 20px;
    position: relative;
    margin-bottom: 7px;
}

.summary-box li::before {
    content: "›";
    position: absolute;
    right: 0;
    color: var(--brass);
    font-weight: 700;
}

/* ===== Keywords ===== */
.keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0 6px;
}

.kw {
    font-size: 11px;
    color: var(--brass-dim);
    border: 1px solid var(--brass-dim);
    border-radius: 999px;
    padding: 4px 12px;
}

/* ===== Notes ===== */
.notes-box {
    margin: 24px 0;
    border: 1px dashed var(--parchment-line);
    border-radius: 8px;
    padding: 14px 16px;
    background: rgba(255,255,255,.35);
}

.notes-box h4 {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--brass-dim);
    margin-bottom: 8px;
}

.notes-box textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--parchment-line);
    border-radius: 3px;
    padding: 10px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.8;
    resize: vertical;
    background: rgba(255,255,255,.6);
    color: var(--ink);
}

.notes-saved {
    font-size: 11px;
    color: var(--ok);
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.3s;
}

.notes-saved.show { opacity: 1; }

/* ===== Seal Mark ===== */
.seal-mark {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 8px;
    padding: 16px 18px;
    border: 1.5px solid rgba(47,107,79,.35);
    border-radius: 8px;
    background: rgba(47,107,79,.08);
}

.seal-mark .st {
    font-size: 13px;
    color: var(--ink-soft);
}

.seal-mark .st b {
    display: block;
    color: var(--ok);
    font-family: var(--serif);
    font-size: 15px;
    margin-bottom: 2px;
}

/* ===== Page Nav ===== */
.page-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--parchment-line);
    gap: 12px;
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--navy-deep);
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid var(--parchment-line);
    background: rgba(255,255,255,.4);
    cursor: pointer;
    font-family: var(--sans);
}

.nav-btn:hover { background: rgba(255,255,255,.8); }

.nav-btn.primary {
    background: var(--navy-deep);
    color: #f2ead4;
    border-color: var(--navy-deep);
}

.nav-btn.primary:hover { background: var(--navy-mid); }

/* ===== Quiz View ===== */
.quiz-view {
    max-width: 800px;
    margin: 0 auto;
}

.quiz-q {
    background: rgba(255,255,255,.5);
    border: 1px solid var(--parchment-line);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 16px;
}

.quiz-q .qtext {
    font-size: 14px;
    font-weight: 600;
    color: var(--navy-deep);
    margin-bottom: 12px;
    line-height: 1.8;
}

.quiz-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink);
    padding: 9px 12px;
    border-radius: 3px;
    border: 1px solid var(--parchment-line);
    margin-bottom: 8px;
    background: rgba(255,255,255,.4);
    cursor: pointer;
}

.quiz-opt:hover { background: rgba(169,130,47,.08); }

.quiz-opt input { accent-color: var(--brass); }

.quiz-opt.correct {
    border-color: var(--ok);
    background: rgba(47,107,79,.1);
}

.quiz-opt.wrong {
    border-color: var(--seal);
    background: rgba(124,54,38,.08);
}

.quiz-submit {
    margin-top: 20px;
    padding: 12px 26px;
    background: var(--brass);
    color: #fff;
    border-radius: 3px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
}

.quiz-submit:hover { background: var(--brass-dim); }

.quiz-result {
    margin-top: 22px;
    padding: 20px;
    border-radius: 3px;
    text-align: center;
    font-family: var(--serif);
    font-size: 17px;
    display: none;
}

.quiz-result.show { display: block; }

.quiz-result.pass {
    background: rgba(47,107,79,.12);
    color: var(--ok);
    border: 1px solid var(--ok);
}

.quiz-result.fail {
    background: rgba(124,54,38,.1);
    color: var(--seal);
    border: 1px solid var(--seal);
}

/* ===== Certificate ===== */
.cert-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10,15,24,.72);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.cert-overlay.show { display: flex; }

.cert-card {
    background: var(--parchment);
    color: var(--ink);
    max-width: 520px;
    width: 100%;
    padding: 36px 32px;
    border-radius: 4px;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.5);
    border: 2px solid var(--brass);
    position: relative;
}

.cert-card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--brass-dim);
    pointer-events: none;
}

.cert-card h2 {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--navy-deep);
    margin: 12px 0 8px;
}

.cert-card .cert-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 18px;
}

.cert-card .cert-name {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--brass-dim);
    border-bottom: 1px solid var(--parchment-line);
    padding-bottom: 8px;
    margin: 16px 0;
}

.cert-card .cert-meta {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
}

.cert-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
}

.cert-actions button {
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 3px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
}

.cert-actions .print-btn {
    background: var(--navy-deep);
    color: #f2ead4;
    border: none;
}

.cert-actions .close-btn {
    background: transparent;
    border: 1px solid var(--parchment-line);
    color: var(--ink);
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 280px;
        z-index: 40;
        transform: translateX(100%);
        transition: transform 0.3s;
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle {
        display: flex !important;
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 50;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--brass);
        color: #fff;
        border: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
    }
    .lesson-cards { grid-template-columns: 1fr; }
}

.mobile-toggle { display: none; }

.backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,24,.55);
    z-index: 35;
}

.sidebar.open ~ .backdrop { display: block; }
</style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
<div class="backdrop" onclick="toggleSidebar()"></div>

<div class="app" id="app">
    <!-- Sidebar (راست) - فقط عناوین 12 فصل -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📚 فصل‌های دوره</h2>
        </div>
        <ul class="chapter-list" id="chapterList"></ul>
    </aside>

    <!-- Main Content (چپ) -->
    <main class="main-content" id="mainContent"></main>

// ===== عناوین 12 فصل (برای منوی سمت راست) =====
const CHAPTERS = [
    "آشنایی با هوش مصنوعی",
    "آشنایی با ابزارها",
    "شروع کار",
    "پرامپت‌نویسی",
    "تکنیک‌های حرفه‌ای",
    "هوش مصنوعی برای وکلا",
    "امنیت و اخلاق",
    "کار عملی",
    "اشتباهات رایج",
    "کتابخانه پرامپت",
    "تمرین",
    "مسیر یادگیری"
];

// ===== State =====
let state = {
    currentChapter: null,      // فصل انتخاب شده (0-11)
    currentLesson: null,       // درس انتخاب شده (0-9)
    viewedLessons: new Set(),  // درس‌های دیده شده (format: "chapterId-lessonId")
    bookmarks: new Set(),      // درس‌های نشان‌شده
    notes: {},                 // یادداشت‌ها
    quizPassed: false,         // آیا آزمون گذرانده شده
    dark: false
};

// ===== توابع کمکی =====
function toFa(n) {
    const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
    return String(n).split('').map(d => map[d] !== undefined ? map[d] : d).join('');
}

function loadState() {
    try {
        const raw = localStorage.getItem('afra-course-state');
        if (raw) {
            const s = JSON.parse(raw);
            state.currentChapter = s.currentChapter;
            state.currentLesson = s.currentLesson;
            state.viewedLessons = new Set(s.viewedLessons || []);
            state.bookmarks = new Set(s.bookmarks || []);
            state.notes = s.notes || {};
            state.quizPassed = s.quizPassed || false;
            state.dark = s.dark || false;
        }
    } catch(e) { console.error(e); }
}

function saveState() {
    try {
        localStorage.setItem('afra-course-state', JSON.stringify({
            currentChapter: state.currentChapter,
            currentLesson: state.currentLesson,
            viewedLessons: [...state.viewedLessons],
            bookmarks: [...state.bookmarks],
            notes: state.notes,
            quizPassed: state.quizPassed,
            dark: state.dark
        }));
    } catch(e) { console.error(e); }
}

// ===== رندر منوی سمت راست (فقط عناوین 12 فصل) =====
function renderChapterList() {
    const list = document.getElementById('chapterList');
    list.innerHTML = CHAPTERS.map((title, idx) => `
        <li class="chapter-item ${state.currentChapter === idx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="chapter-num">${toFa(idx + 1)}</span>
            <span>${title}</span>
        </li>
    `).join('');
}

// ===== انتخاب فصل =====
function selectChapter(idx) {
    state.currentChapter = idx;
    state.currentLesson = null;
    saveState();
    renderChapterList();
    renderMain();
    closeSidebar();
}

// ===== رندر محتوای اصلی =====
function renderMain() {
    const main = document.getElementById('mainContent');
    
    if (state.currentChapter === null) {
        // صفحه خوش‌آمدگویی
        main.innerHTML = `
            <div class="welcome-screen">
                <h1>هوش مصنوعی برای وکلا</h1>
                <p>یک دوره مقدماتی و کاربردی، ساخته‌شده برای اعضای باشگاه وکلای افرا، تا بدون هیچ پیش‌زمینه فنی، فهم درستی از هوش مصنوعی و کاربرد آن در کار حقوقی پیدا کنید. فصل اول شامل ده درس کوتاه است؛ در پایان هر درس، خلاصه و تمرین کوچکی برای تثبیت یادگیری آمده و در پایان فصل، یک آزمون کوتاه منتظر شماست.</p>
                <button class="btn-start" onclick="selectChapter(0)">شروع دوره ←</button>
            </div>
        `;
        return;
    }
    
    if (state.currentLesson !== null) {
        // نمایش محتوای درس
        renderLessonContent();
        return;
    }
    
    // نمایش کارت‌های 10 درس + کارت آزمون
    renderLessonCards();
}

// ===== رندر کارت‌های 10 درس =====
function renderLessonCards() {
    const main = document.getElementById('mainContent');
    const chapterTitle = CHAPTERS[state.currentChapter];
    
    // فقط فصل اول درس دارد
    const lessons = state.currentChapter === 0 ? LESSONS : [];
    const allViewed = lessons.length > 0 && lessons.every(l => state.viewedLessons.has(`0-${l.id - 1}`));
    
    let html = `
        <div class="chapter-view">
            <h2 class="chapter-title">فصل ${toFa(state.currentChapter + 1)}: ${chapterTitle}</h2>
            <p class="chapter-desc">${state.currentChapter === 0 ? 'ده درس کوتاه برای آشنایی با مفاهیم پایه هوش مصنوعی' : 'این فصل به‌زودی اضافه می‌شود'}</p>
    `;
    
    if (lessons.length > 0) {
        html += `<div class="lesson-cards">`;
        lessons.forEach((lesson, idx) => {
            const viewed = state.viewedLessons.has(`0-${idx}`);
            html += `
                <div class="lesson-card ${viewed ? 'viewed' : ''}" onclick="openLesson(${idx})">
                    <div class="lesson-card-num">${viewed ? '✓' : toFa(idx + 1)}</div>
                    <div class="lesson-card-title">${lesson.title}</div>
                    <div class="lesson-card-meta">
                        <span>⏱ ${lesson.readingTime}</span>
                        <span>${viewed ? '✓ دیده‌شده' : 'جدید'}</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        
        // کارت آزمون
        const quizStatus = allViewed ? 'unlocked' : 'locked';
        html += `
            <div class="quiz-card ${quizStatus}" ${allViewed ? 'onclick="openQuiz()"' : ''}>
                <h3>🏁 آزمون پایان فصل</h3>
                <p>${allViewed ? 'همه درس‌ها را دیده‌اید! آزمون آماده است' : `برای فعال شدن آزمون، همه ${toFa(lessons.length)} درس را ببینید`}</p>
                <div class="quiz-progress">
                    <div class="quiz-progress-bar">
                        <div class="quiz-progress-fill" style="width: ${(state.viewedLessons.size / lessons.length) * 100}%"></div>
                    </div>
                    <span>${toFa(state.viewedLessons.size)} از ${toFa(lessons.length)}</span>
                </div>
            </div>
        `;
    }
    
    html += `</div>`;
    main.innerHTML = html;
}

// ===== باز کردن درس =====
function openLesson(idx) {
    state.currentLesson = idx;
    state.viewedLessons.add(`0-${idx}`);
    saveState();
    renderChapterList();
    renderLessonContent();
}

// ===== رندر محتوای درس =====
function renderLessonContent() {
    const main = document.getElementById('mainContent');
    const lesson = LESSONS[state.currentLesson];
    const lessonKey = `0-${state.currentLesson}`;
    const isBookmarked = state.bookmarks.has(lessonKey);
    const note = state.notes[lessonKey] || '';
    
    let html = `
        <div class="lesson-content-view">
            <div class="lesson-breadcrumb">
                <a onclick="backToChapter()">فصل ۱: ${CHAPTERS[0]}</a>
                <span>›</span>
                <span>درس ${toFa(state.currentLesson + 1)}</span>
            </div>
            
            <div class="lesson-content-header">
                <h1>${lesson.icon} ${lesson.title}</h1>
                <div class="lesson-meta">
                    <span class="meta-pill">⏱ ${lesson.readingTime}</span>
                    <span class="meta-pill">سطح: ${lesson.difficulty}</span>
                    <button class="bm-btn ${isBookmarked ? 'on' : ''}" onclick="toggleBookmark()">
                        ${isBookmarked ? '★ نشان‌شده' : '☆ نشان‌گذاری'}
                    </button>
                </div>
            </div>
    `;
    
    // اهداف
    if (lesson.objectives && lesson.objectives.length) {
        html += `<div class="objectives"><h3>در پایان این درس می‌توانید:</h3><ul>`;
        lesson.objectives.forEach(o => html += `<li>${o}</li>`);
        html += `</ul></div>`;
    }
    
    // بخش‌ها
    (lesson.sections || []).forEach(s => {
        html += `<div class="lesson-section"><h2>${s.heading}</h2>`;
        (s.paragraphs || []).forEach(p => html += `<p>${p}</p>`);
        html += `</div>`;
    });
    
    // واژه‌نامه
    if (lesson.glossary && lesson.glossary.length) {
        html += `<div class="glossary-list">`;
        lesson.glossary.forEach(g => {
            html += `<div class="gloss-item"><div class="gloss-term">${g.term}</div><div class="gloss-def">${g.definition}</div></div>`;
        });
        html += `</div>`;
    }
    
    // کارت‌های اطلاعات
    const hasCards = (lesson.examples && lesson.examples.length) || (lesson.tips && lesson.tips.length) || (lesson.commonMistakes && lesson.commonMistakes.length);
    if (hasCards) {
        html += `<div class="card-grid">`;
        if (lesson.examples && lesson.examples.length) {
            html += `<div class="info-card card-examples"><h4><span>✦</span> مثال‌ها</h4><ul>`;
            lesson.examples.forEach(e => html += `<li>${e}</li>`);
            html += `</ul></div>`;
        }
        if (lesson.tips && lesson.tips.length) {
            html += `<div class="info-card card-tips"><h4><span>✓</span> نکات کاربردی</h4><ul>`;
            lesson.tips.forEach(t => html += `<li>${t}</li>`);
            html += `</ul></div>`;
        }
        if (lesson.commonMistakes && lesson.commonMistakes.length) {
            html += `<div class="info-card card-mistakes"><h4><span>⚠</span> اشتباهات رایج</h4><ul>`;
            lesson.commonMistakes.forEach(m => html += `<li>${m}</li>`);
            html += `</ul></div>`;
        }
        html += `</div>`;
    }
    
    // تمرین
    if (lesson.exercise && lesson.exercise.length) {
        html += `<div class="exercise-box"><h4>✎ تمرین این درس</h4>`;
        lesson.exercise.forEach(e => html += `<p>${e}</p>`);
        html += `<button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">نمایش پاسخ پیشنهادی</button>
        <div class="answer-box">`;
        (lesson.answer || []).forEach(a => html += `<span class="lbl">پاسخ پیشنهادی</span>${a}`);
        html += `</div></div>`;
    }
    
    // خلاصه
    if (lesson.summary && lesson.summary.length) {
        html += `<div class="summary-box"><h4>خلاصه درس</h4><ul>`;
        lesson.summary.forEach(s => html += `<li>${s}</li>`);
        html += `</ul></div>`;
    }
    
    // کلیدواژه‌ها
    if (lesson.keywords && lesson.keywords.length) {
        html += `<div class="keywords">`;
        lesson.keywords.forEach(k => html += `<span class="kw">#${k}</span>`);
        html += `</div>`;
    }
    
    // یادداشت
    html += `
        <div class="notes-box">
            <h4>📝 یادداشت شخصی شما</h4>
            <textarea id="lessonNote" placeholder="یادداشت‌های خود را اینجا بنویسید...">${note}</textarea>
            <div class="notes-saved" id="notesSaved">ذخیره شد ✓</div>
        </div>
    `;
    
    // مهر خوانده شد
    html += `
        <div class="seal-mark">
            <div style="font-size:32px">✅</div>
            <div class="st"><b>این درس مطالعه شد ✓</b>مهر سبز در فهرست کناری نیز ثبت شد.</div>
        </div>
    `;
    
    // ناوبری
    const hasPrev = state.currentLesson > 0;
    const hasNext = state.currentLesson < LESSONS.length - 1;
    
    html += `<div class="page-nav">`;
    if (hasPrev) {
        html += `<button class="nav-btn" onclick="openLesson(${state.currentLesson - 1})">→ <span>${LESSONS[state.currentLesson - 1].title}<br><small>درس قبلی</small></span></button>`;
    } else {
        html += `<span></span>`;
    }
    
    if (!lesson.isFinal) {
        if (hasNext) {
            html += `<button class="nav-btn primary" onclick="openLesson(${state.currentLesson + 1})"><span>${LESSONS[state.currentLesson + 1].title}<br><small>درس بعدی</small></span> ←</button>`;
        } else {
            html += `<button class="nav-btn primary" onclick="backToChapter()"><span>بازگشت به فصل ←</span></button>`;
        }
    } else {
        html += `<span></span>`;
    }
    html += `</div>`;
    
    // آزمون
    if (lesson.isFinal) {
        html += renderQuiz();
    }
    
    html += `</div>`;
    main.innerHTML = html;
    
    // رویداد یادداشت
    const noteEl = document.getElementById('lessonNote');
    if (noteEl) {
        let t;
        noteEl.addEventListener('input', function() {
            clearTimeout(t);
            t = setTimeout(() => saveNote(lessonKey, noteEl.value), 400);
        });
    }
}

// ===== رندر آزمون =====
function renderQuiz() {
    let html = `
        <div class="quiz-view" style="margin-top:30px;">
            <h2 style="font-family:var(--serif);font-size:20px;color:var(--navy-deep);margin-bottom:12px;">🏁 آزمون پایان فصل اول</h2>
            <p style="color:var(--ink-soft);margin-bottom:20px;">به ده سؤال زیر پاسخ دهید و در پایان نتیجه را ببینید. این آزمون فقط برای سنجش شخصی شماست.</p>
            <form id="quizForm">
    `;
    
    QUIZ.forEach((q, qi) => {
        html += `<div class="quiz-q"><p class="qtext">${toFa(qi + 1)}. ${q.q}</p>`;
        q.options.forEach((opt, oi) => {
            html += `<label class="quiz-opt" data-q="${qi}" data-o="${oi}">
                <input type="radio" name="q${qi}" value="${oi}"> <span>${opt}</span>
            </label>`;
        });
        html += `</div>`;
    });
    
    html += `
        <button type="button" class="quiz-submit" onclick="submitQuiz()">مشاهده نتیجه آزمون</button>
        <div class="quiz-result" id="quizResult" role="status" aria-live="polite"></div>
        </form>
        </div>
    `;
    
    return html;
}

// ===== ارسال آزمون =====
function submitQuiz() {
    let score = 0;
    QUIZ.forEach((q, qi) => {
        const chosen = document.querySelector(`input[name="q${qi}"]:checked`);
        const opts = document.querySelectorAll(`.quiz-opt[data-q="${qi}"]`);
        opts.forEach(o => {
            const oi = parseInt(o.dataset.o);
            o.classList.remove('correct', 'wrong');
            if (oi === q.correct) o.classList.add('correct');
            else if (chosen && parseInt(chosen.value) === oi) o.classList.add('wrong');
        });
        if (chosen && parseInt(chosen.value) === q.correct) score++;
    });
    
    const result = document.getElementById('quizResult');
    const pass = score >= 7;
    result.className = 'quiz-result show ' + (pass ? 'pass' : 'fail');
    result.innerHTML = pass
        ? `آفرین! نمره شما ${toFa(score)} از ${toFa(QUIZ.length)} — فصل اول را با موفقیت گذراندید.`
        : `نمره شما ${toFa(score)} از ${toFa(QUIZ.length)} — پیشنهاد می‌شود درس‌های مربوط به سؤالات نادرست را مرور کنید.`;
    
    if (pass) {
        state.quizPassed = true;
        saveState();
        const d = new Date();
        const faDate = d.toLocaleDateString('fa-IR');
        document.getElementById('certDate').textContent = faDate;
        document.getElementById('certOverlay').classList.add('show');
    }
    
    result.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===== بازگشت به فصل =====
function backToChapter() {
    state.currentLesson = null;
    saveState();
    renderMain();
}

// ===== باز کردن آزمون =====
function openQuiz() {
    state.currentLesson = 9; // آخرین درس (جمع‌بندی)
    saveState();
    renderLessonContent();
}

// ===== نشان‌گذاری =====
function toggleBookmark() {
    const key = `0-${state.currentLesson}`;
    if (state.bookmarks.has(key)) state.bookmarks.delete(key);
    else state.bookmarks.add(key);
    saveState();
    renderLessonContent();
}

// ===== ذخیره یادداشت =====
function saveNote(key, text) {
    state.notes[key] = text;
    saveState();
    const el = document.getElementById('notesSaved');
    if (el) {
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 1500);
    }
}

// ===== مدیریت Sidebar موبایل =====
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('open');
}

function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.remove('open');
}

// ===== راه‌اندازی =====
loadState();
renderChapterList();
renderMain();
</script>
