<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوش مصنوعی برای وکلا | باشگاه وکلای افرا</title>
    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استایل‌های اختصاصی دوره */
        .chapter-view {
            padding: 20px;
        }

        .chapter-view h2 {
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 24px;
        }

        .lesson-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .lesson-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(25, 118, 210, 0.15);
        }

        .lesson-card.viewed {
            border-color: var(--success);
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(76, 175, 80, 0.05) 100%);
        }

        .lesson-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lesson-number {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .lesson-card h3 {
            color: var(--text);
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .lesson-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .difficulty.مقدماتی {
            background: #e3f2fd;
            color: #1976d2;
        }

        .difficulty.متوسط {
            background: #fff3e0;
            color: #f57c00;
        }

        .difficulty.پیشرفته {
            background: #fce4ec;
            color: #c2185b;
        }

        .viewed-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background: var(--success);
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }

        .bookmarked {
            color: #ffc107;
        }

        .quiz-card {
            background: var(--card-bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .quiz-card.unlocked {
            border-style: solid;
            border-color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-card.unlocked:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .quiz-card.completed {
            border-style: solid;
            border-color: var(--success);
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(76, 175, 80, 0.1) 100%);
        }

        .quiz-card h3 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 10px;
        }

        .quiz-card.completed h3 {
            color: var(--success);
        }

        /* Lesson View */
        .lesson-view {
            padding: 20px;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-back, .btn-bookmark {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-back {
            background: var(--primary);
            color: white;
        }

        .btn-back:hover {
            background: var(--primary-dark);
        }

        .btn-bookmark {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-bookmark.bookmarked {
            background: #fff3e0;
            border-color: #ffc107;
            color: #f57c00;
        }

        .lesson-view h1 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 20px;
        }

        .lesson-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            line-height: 2;
        }

        .lesson-content h2 {
            color: var(--primary);
            font-size: 22px;
            margin: 25px 0 15px 0;
        }

        .lesson-content ul {
            margin: 15px 0;
            padding-right: 30px;
        }

        .lesson-content li {
            margin-bottom: 10px;
        }

        .notes-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .notes-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .lesson-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn-prev, .btn-next, .btn-complete {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-prev, .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-prev:hover, .btn-next:hover {
            background: var(--primary-dark);
        }

        .btn-complete {
            background: var(--success);
            color: white;
        }

        .btn-complete:hover {
            background: #388e3c;
        }

        .welcome-section {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-section h2 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 20px;
        }

        .welcome-section p {
            font-size: 18px;
            color: var(--text);
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/logo.png" alt="لوگو" class="sidebar-logo">
                <h2>باشگاه وکلای افرا</h2>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="../../index.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>صفحه اصلی</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle">
                            <i class="fas fa-graduation-cap"></i>
                            <span>دوره‌ها</span>
                            <i class="fas fa-chevron-down"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li class="nav-item">
                                <a href="#" class="nav-link active">
                                    <i class="fas fa-book"></i>
                                    <span>هوش مصنوعی برای وکلا</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="../../services/index.html" class="nav-link">
                            <i class="fas fa-briefcase"></i>
                            <span>خدمات</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-theme">
                    <i class="fas fa-moon"></i>
                    <span>حالت تاریک</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>هوش مصنوعی برای وکلا</h1>
                <p>دوره جامع آموزش هوش مصنوعی ویژه وکلا و حقوق‌دانان</p>
            </div>

            <div class="content-wrapper">
                <div class="chapter-sidebar">
                    <h3>فصل‌های دوره</h3>
                    <ul id="chapter-list"></ul>
                </div>

                <div id="main-content">
                    <!-- محتوای اصلی اینجا رندر می‌شود -->
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/script.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
