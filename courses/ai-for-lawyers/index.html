<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوش مصنوعی برای وکلا | باشگاه وکلای افرا</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="course-ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- هدر موبایل -->
<div class="mobile-header">
  <button class="menu-btn" id="menu-toggle" aria-label="منو">
    <i class="fas fa-bars"></i>
  </button>
  <span style="font-weight:700;font-size:0.95rem;">هوش مصنوعی برای وکلا</span>
  <button class="menu-btn" id="theme-toggle-mobile" aria-label="حالت تاریک">
    <i class="fas fa-moon"></i>
  </button>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="course-page">
  <!-- سایدبار دوره -->
  <aside class="course-sidebar" id="course-sidebar">
    <div class="sidebar-brand">
      <img src="../../assets/logo.jpg" alt="لوگو" onerror="this.src='../../assets/logo.png'">
      <h2>باشگاه وکلای افرا</h2>
    </div>

    <!-- لینک‌های اصلی سایت -->
    <ul class="sidebar-nav-course">
      <li>
        <a href="../../index.html" class="nav-link">
          <i class="fas fa-home"></i> صفحه اصلی
        </a>
      </li>
      <li>
        <a href="../../courses/index.html" class="nav-link">
          <i class="fas fa-graduation-cap"></i> همه دوره‌ها
        </a>
      </li>
      <li>
        <a href="../../prompts/index.html" class="nav-link">
          <i class="fas fa-book-open"></i> کتابخانه پرامپت‌ها
        </a>
      </li>
      <li>
        <a href="../../services/index.html" class="nav-link">
          <i class="fas fa-briefcase"></i> خدمات
        </a>
      </li>
    </ul>

    <!-- جستجوی فصل -->
    <div class="search-box-course">
      <input type="text" id="chapter-search" placeholder="جستجوی فصل...">
      <i class="fas fa-search"></i>
    </div>

    <!-- لیست ۱۲ فصل -->
    <div style="padding: 0 0.75rem 0.25rem; font-size:0.78rem; color:var(--text-light); font-weight:600;">
      فصل‌های دوره
    </div>
    <ul class="chapters-accordion" id="chapter-list">
      <!-- توسط JS پر می‌شود -->
    </ul>

    <div class="sidebar-footer-course">
      <button class="btn-sidebar" id="theme-toggle">
        <i class="fas fa-moon"></i> حالت تاریک
      </button>
      <button class="btn-sidebar" id="focus-toggle">
        <i class="fas fa-expand"></i> حالت تمرکز
      </button>
    </div>
  </aside>

  <!-- محتوای اصلی -->
  <main class="course-main" id="content-area">
    <!-- توسط app.js پر می‌شود -->
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  // منوی موبایل
  const sidebar = document.getElementById('course-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const menuBtn = document.getElementById('menu-toggle');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }

  menuBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  // دارک‌مود
  function applyTheme(isDark) {
    document.body.classList.toggle('dark-mode', isDark);
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    const icon = isDark ? 'fa-sun' : 'fa-moon';
    const text = isDark ? 'حالت روشن' : 'حالت تاریک';
    document.querySelectorAll('#theme-toggle, #theme-toggle-mobile').forEach(btn => {
      btn.innerHTML = `<i class="fas ${icon}"></i> ${btn.id === 'theme-toggle-mobile' ? '' : text}`;
    });
  }

  const savedTheme = localStorage.getItem('theme') || 'light';
  applyTheme(savedTheme === 'dark');

  document.getElementById('theme-toggle').addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark-mode'));
  });
  document.getElementById('theme-toggle-mobile').addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark-mode'));
  });

  // حالت تمرکز
  document.getElementById('focus-toggle').addEventListener('click', () => {
    document.body.classList.toggle('focus-mode');
    const btn = document.getElementById('focus-toggle');
    const isFocus = document.body.classList.contains('focus-mode');
    btn.innerHTML = isFocus
      ? '<i class="fas fa-compress"></i> خروج از تمرکز'
      : '<i class="fas fa-expand"></i> حالت تمرکز';
  });

  // جستجوی فصل
  document.getElementById('chapter-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#chapter-list li').forEach(li => {
      const text = li.textContent.toLowerCase();
      li.style.display = text.includes(q) ? '' : 'none';
    });
  });
</script>
</body>
</html>
